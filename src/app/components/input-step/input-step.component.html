<mat-card class="card" *ngIf="definition() as def">
    <mat-card-header>
        <!-- TODO show (i) icon with placeholder text for help -->
        <mat-card-title class="card-title">
            {{def.value.caption}}
        </mat-card-title>
    </mat-card-header>
    <mat-card-content class="content">
    @if(def.type === 'select') {
        <mat-button-toggle-group class="select-group"
            [ngClass]="{ 
                'wrap-options': def.value.multiline, 
                'inline-options': !def.value.multiline 
            }"
            [name]="def.value.id" 
            [multiple]="def.value.multiple"
            [disabled]="disabled()"
            [ngModel]="value()"
            (ngModelChange)="updateValue($event)">
            @for(opt of def.value.options; track $index) {
                <mat-button-toggle [value]="opt">
                    {{opt}}
                </mat-button-toggle>
            }
            <mat-error *ngIf="!valid">
                {{validationMessage}}
            </mat-error>
        </mat-button-toggle-group>
    } @else if (def.type === 'textarea') {
        <mat-form-field class="form-field" appearance="outline">
            <textarea matInput
                [name]="def.value.id" 
                [disabled]="disabled()"
                [placeholder]="def.value.placeholder"
                [pattern]="def.value.validation"
                [ngModel]="value()"
                (ngModelChange)="updateValue($event)"
                ></textarea>
            <mat-error *ngIf="!valid">
                {{validationMessage}}
            </mat-error>
        </mat-form-field>
    } @else if (def.type === 'text') {
        <mat-form-field class="field" appearance="outline">
            <input type="text" matInput
                [name]="def.value.id" 
                [disabled]="disabled()"
                [placeholder]="def.value.placeholder"
                [pattern]="def.value.validation"
                [ngModel]="value()"
                (ngModelChange)="updateValue($event)"/>
            <mat-error *ngIf="!valid">
                {{validationMessage}}
            </mat-error>
        </mat-form-field>
    }
    </mat-card-content>
</mat-card>
