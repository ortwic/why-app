<section>
    <h2>{{ 'settings.sub-selected' | t}}</h2>
    <div class="card-container">
        @for (item of guides(); track $index) {
            <mat-card class="card">
                <mat-card-header class="card-header">
                    <span>
                        <input type="radio" name="guide" [value]="item" [checked]="selected().id === item.id" 
                            (change)="selectGuide(item)"/>
                    </span>
                    <div class="card-title no-wrap">
                        <mat-card-title [title]="item.title">
                        </mat-card-title>
                        <mat-card-subtitle>
                            {{item.caption}}
                        </mat-card-subtitle>
                    </div>
                </mat-card-header>
                <mat-card-content class="card-content">
                    <p class="synopsis">
                        {{item.description}}
                    </p>
                </mat-card-content>
            </mat-card>
        }
    </div>
</section>
